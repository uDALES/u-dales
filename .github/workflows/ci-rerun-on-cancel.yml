name: Re-run CI on infra cancellation

# Recovers from GitHub-side cancellations (runner loss, runner never acquired,
# infra hiccups) that cancel CI jobs through no fault of the pipeline.
#
# A run whose jobs were ALL cancelled concludes `cancelled`; a run in which
# only SOME jobs were cancelled (the common case: one macOS runner was never
# acquired while the others passed) concludes `failure`. Both are handled: the
# job below inspects the per-job conclusions and re-runs the failed jobs only
# when every non-successful job was cancelled. Genuine build/test failures are
# left alone so real problems still surface. A run_attempt cap prevents
# infinite retry loops.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run jobs if every non-successful job was cancelled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          # Conclusions of every job that did not succeed or get skipped.
          bad=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .conclusion' \
            | sort -u)
          echo "CI run ${RUN_ID} concluded '${CONCLUSION}' (attempt ${ATTEMPT});" \
               "non-successful job conclusions: ${bad:-none}"
          if [ -z "${bad}" ]; then
            echo "Nothing to re-run."
          elif [ "${bad}" = "cancelled" ]; then
            echo "Only cancelled jobs: re-running the failed jobs."
            gh api --method POST \
              "repos/${{ github.repository }}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          else
            echo "Genuine failures present; leaving the run alone."
          fi
