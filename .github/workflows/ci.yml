name: CI

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # uDALES runs one MPI rank per CPU and never oversubscribes: every runner checks
  # the requested ranks against the CPUs granted to it (tools/mpi_env.sh,
  # tests/integration/mpi_env.py) and fails with both numbers otherwise. The
  # hosted Linux runner exposes 4 CPUs as 2 cores with 2 hardware threads each;
  # Open MPI counts one slot per core and binds one rank per core by default, so
  # tell it to treat hardware threads as CPUs (what `mpiexec --use-hwthread-cpus`
  # does). That is a mapping choice, not oversubscription: four ranks on four
  # CPUs. Open MPI 4 (ORTE) takes slots and binding from the one hwloc variable.
  # Open MPI 5 (PRRTE) keeps the two apart, as --use-hwthread-cpus does
  # internally: the HWTCPUS mapping qualifier sets the CPU unit used for mapping
  # and binding, prte_set_default_slots the slot count (either alone fails: the
  # qualifier leaves one slot per core, the slot count leaves core binding). All
  # are ignored by other MPIs. The macOS runner has three CPUs, so the
  # supported-macos selection runs the MPI tests on at most two ranks
  # (tests/test_suites.yml).
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "true"
  PRTE_MCA_rmaps_default_mapping_policy: ":hwtcpus"
  PRTE_MCA_prte_set_default_slots: "hwthreads"

jobs:
  build-and-supported-tests:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    name: ${{ matrix.os }} ${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
        build-type: ['Debug', 'Release']

    steps:
    - name: Check-out project
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up repository
      # Clone all history leading to the tip of a single branch
      # See https://stackoverflow.com/a/44036486.
      run: |
        git remote set-branches --add origin master
        git fetch origin master

    - name: Install system dependencies
      run: bash .github/scripts/install_deps.sh

    - name: Install python dependencies
      uses: conda-incubator/setup-miniconda@9b650ee299f7fe47ab3a9688166e64e965c83272 # main (node24)
      with:
        miniconda-version: "latest"
        auto-update-conda: true
        activate-environment: udales
        environment-file: environment.yml
        channel-priority: strict

    - name: Build preprocessing tools
      shell: bash -l {0}
      run: |
        # Work around numpy.f2py + setuptools distutils incompatibility on macOS runners.
        export SETUPTOOLS_USE_DISTUTILS=stdlib
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          python -m pip install "setuptools<74"
        fi
        PREPROCESSING_PYTHON_EXECUTABLE="$(command -v python)" \
          bash tools/build_preprocessing.sh common preprocessing_tools

    - name: Install uDALES Python tools (editable)
      shell: bash -l {0}
      # Registers tools/python on the path so the test suite imports udbase/
      # udgeom/udprep/udvis without sys.path edits. --no-deps: deps come from
      # environment.yml.
      run: python -m pip install -e tools/python --no-deps

    - name: Build current branch for integration tests
      shell: bash -l {0}
      run: |
        # This step overrides the default shell, which drops GitHub's `-eo
        # pipefail`. The build is piped into tee below, so pipefail is required
        # or a failed build would be masked by tee's exit status.
        set -o pipefail
        build_dir="build/${{ matrix.build-type }}"
        build_dir="$(printf '%s' "$build_dir" | tr '[:upper:]' '[:lower:]')"
        echo "UDALES_BUILD_LOG=${build_dir}/build.log" >> "$GITHUB_ENV"
        source .github/scripts/setup_mpi_env.sh "${{ matrix.os }}"
        if [ ${{ matrix.os }} = 'macos-latest' ]; then
          which gfortran
          gfortran --version
          "$UDALES_MPI_FORTRAN_COMPILER" --showme:command || "$UDALES_MPI_FORTRAN_COMPILER" -show
        fi
        cmake -S . -B "$build_dir" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DCMAKE_Fortran_COMPILER="$UDALES_MPI_FORTRAN_COMPILER" \
          -DMPI_Fortran_COMPILER="$UDALES_MPI_FORTRAN_COMPILER" \
          -DMPI_C_COMPILER="$UDALES_MPI_C_COMPILER" \
          -DMPIEXEC_EXECUTABLE="$UDALES_MPIEXEC"
        cmake --build "$build_dir" -- -j 4 2>&1 | tee "$build_dir/build.log"

    - name: Summarise compiler warnings
      # Reporting only -- deliberately never fails the build. See the script
      # header for why this is not a -Werror gate.
      if: always()
      run: bash .github/scripts/summarise_warnings.sh "$UDALES_BUILD_LOG" "${{ matrix.os }} ${{ matrix.build-type }}"

    - name: Build and test uDALES
      shell: bash -l {0}
      run: |
        source .github/scripts/setup_mpi_env.sh "${{ matrix.os }}"
        # Temporary: macOS skips the branch-comparison regression until master
        # contains the findFFTW helper-project CMake minimum-version fix.
        # Remove supported-macos and switch back to supported on macOS once
        # that fix has been merged into master.
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          selection="supported-macos"
        else
          selection="supported"
        fi
        python3 -u tests/run_tests.py "$selection" --branch-a master --branch-b $GITHUB_SHA --build-type ${{ matrix.build-type }}

  python-viz:
    # environment.yml installs PyVista (the default backend), but the GL-free
    # matrix gate skips the PyVista *rendering* tests because they require
    # PYVISTA_OFF_SCREEN. This Linux job adds headless GL and the optional Plotly
    # backend, then runs the visualization tests off-screen so BOTH backends are
    # exercised by the merge gate.
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    name: python-viz (both backends)
    runs-on: ubuntu-latest

    steps:
    - name: Check-out project
      uses: actions/checkout@v6

    - name: Install headless OpenGL/xvfb for VTK
      # Ubuntu 24.04 (noble) dropped the transitional libgl1-mesa-glx package;
      # libgl1 + libglx-mesa0 provide libGL/GLX and libgl1-mesa-dri provides the
      # software (llvmpipe) renderer needed for off-screen rendering under xvfb.
      run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libxrender1

    - name: Install python dependencies
      uses: conda-incubator/setup-miniconda@9b650ee299f7fe47ab3a9688166e64e965c83272 # main (node24)
      with:
        miniconda-version: "latest"
        auto-update-conda: true
        activate-environment: udales
        environment-file: environment.yml
        channel-priority: strict

    - name: Install optional Plotly backend
      shell: bash -l {0}
      run: python -m pip install -r tools/python/requirements-plotly.txt

    - name: Install uDALES Python tools (editable)
      shell: bash -l {0}
      run: python -m pip install -e tools/python --no-deps

    - name: Run visualization tests (both backends, off-screen)
      shell: bash -l {0}
      env:
        PYVISTA_OFF_SCREEN: "true"
        MPLBACKEND: Agg
      run: xvfb-run -a python -m unittest discover -s tools/python/tests -p "test_udbase_vis.py"

  docs:
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    name: docs
    runs-on: ubuntu-latest

    steps:
    - name: Check-out project
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up repository
      run: |
        git remote set-branches --add origin master
        git fetch origin master

    - name: Install system dependencies
      run: bash .github/scripts/install_deps.sh

    - name: Install python dependencies
      uses: conda-incubator/setup-miniconda@9b650ee299f7fe47ab3a9688166e64e965c83272 # main (node24)
      with:
        miniconda-version: "latest"
        auto-update-conda: true
        activate-environment: udales
        environment-file: environment.yml
        channel-priority: strict

    - name: Build docs
      shell: bash -l {0}
      run: |
        mkdocs build --site-dir build/html
        ford ford.md

    - name: Upload docs artifact
      uses: actions/upload-artifact@v7
      with:
        name: docs-html
        path: build/html/

  publish-docs:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    name: publish-docs
    runs-on: ubuntu-latest
    needs: docs

    steps:
    - name: Download docs artifact
      uses: actions/download-artifact@v4
      with:
        name: docs-html
        path: build/html/

    - name: Publish docs
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: build/html/
        force_orphan: true
