      - label: "nesting: I3 uniform flow"
        class: experimental
        kind: integration
        component: nesting
        platform: hpc
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_BASELINE: "{repo_root}/build/u-dales.baseline"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting_cases.py"
          - "TestI3UniformFlow"
      - label: "nesting: I4 manufactured solenoidal field"
        class: experimental
        kind: integration
        component: nesting
        platform: hpc
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_BASELINE: "{repo_root}/build/u-dales.baseline"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting_cases.py"
          - "TestI4ManufacturedSolenoidal"
      - label: "nesting: I5 decomposition parity"
        class: experimental
        kind: integration
