  # V1 "Big Brother" nesting validation (docs/udales-nesting-design.md 10.4).
  # An on-demand campaign, NOT a gate: this group is deliberately not included
  # by `all`, `supported` or `nesting`, and must be asked for by name.
  nesting-validation:
    suites:
      - label: "nesting-validation: V1 tiny end-to-end (harness smoke test)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/test_v1_tiny.py"
      - label: "nesting-validation: V1 Big Brother production campaign"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: slow
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_V1_RUNDIR: "{repo_root}/build/nesting-validation-v1"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/run_v1.py"
          - "{repo_root}/build/nesting-validation-v1"
          - "--preset"
          - "production"
          - "--yes"
      - label: "nesting-validation: V2 tiny sweep (harness smoke test)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/test_v2_tiny.py"
      # Reuses the V1 parent and the V1 child rather than running them, so the
      # V1 production entry above has to have run first -- --parent-dir and
      # --reuse-dir below point into its run directory.  On CX3 submit
      # tests/validation/nesting/submit_cx3_v2.pbs instead: it defaults to the
      # 'converged' V1 run in $EPHEMERAL and is sized against its measured
      # stage times.
      - label: "nesting-validation: V2 falsification sweep (production)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: slow
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/run_v2.py"
          - "{repo_root}/build/nesting-validation-v2"
          - "--sweep"
          - "v2"
          - "--parent-dir"
          - "{repo_root}/build/nesting-validation-v1/903"
          - "--reuse-dir"
          - "{repo_root}/build/nesting-validation-v1/904"
          - "--yes"
      - label: "nesting-validation: C0 tiny cadence sweeps (harness smoke test)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/test_c0_tiny.py"
      # C0a: the V1 child at 6 s and 9 s boundary cadence (and Catmull-Rom at
      # 3 s), sliced from the V1 parent's existing dumps, against the reused V1
      # child -- so the V1 production entry has to have run first.  On CX3:
      #   qsub -v UDALES_V2_SWEEP=c0,UDALES_V2_RUNDIR=$EPHEMERAL/nesting-c0a \
      #        -l walltime=03:00:00 tests/validation/nesting/submit_cx3_v2.pbs
      - label: "nesting-validation: C0a cadence sweep off the existing dumps (production)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: slow
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/run_v2.py"
          - "{repo_root}/build/nesting-validation-c0a"
          - "--sweep"
          - "c0"
          - "--parent-dir"
          - "{repo_root}/build/nesting-validation-v1/903"
          - "--reuse-dir"
          - "{repo_root}/build/nesting-validation-v1/904"
          - "--yes"
      # C0b: a parent warm-started from the V1 parent's end-of-spin-up restart,
      # dumping every 0.5 s, and six children sliced from it at 0.5-9 s.  On CX3
      # submit tests/validation/nesting/submit_cx3_c0b.pbs instead.
      - label: "nesting-validation: C0b fine-cadence ladder (production)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: slow
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/run_v2.py"
          - "{repo_root}/build/nesting-validation-c0b"
          - "--sweep"
          - "c0b"
          - "--parent-restart-dir"
          - "{repo_root}/build/nesting-validation-v1/903"
          - "--yes"
      - label: "nesting-validation: V0 tiny refinement suite (harness smoke test)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/test_v0_tiny.py"
      # V0 measures every child against a fine, unnested reference and drives the
      # 'filtered' arm from that same reference's dumps, so the V1 production
      # entry above has to have run first -- --reference-dir points at it.  On
      # CX3 submit tests/validation/nesting/submit_cx3_v0.pbs instead: it
      # defaults to the 'converged' V1 run in $EPHEMERAL and is sized against
      # its measured stage times.
      - label: "nesting-validation: V0 refinement validation (production)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: slow
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/run_v0.py"
          - "{repo_root}/build/nesting-validation-v0"
          - "--suite"
          - "v0"
          - "--reference-dir"
          - "{repo_root}/build/nesting-validation-v1/903"
          - "--yes"
      # V3 and V4 -- the two experiments where parent and child geometry differ
      # (design section 9.4).  The tiny entry drives both end to end and also
      # checks the production experiments' configuration, including that V4's
      # child really is the V1 converged child.
      - label: "nesting-validation: V3/V4 geometry-mismatch tiny end-to-end (harness smoke test)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/test_v34_tiny.py"
      # V3 runs its own two periodic runs (an equilibrium reference and a flat
      # parent) and needs nothing from V1.  On CX3 submit
      # tests/validation/nesting/submit_cx3_v3.pbs instead.
      - label: "nesting-validation: V3 parent without buildings (production)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: slow
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/run_geometry.py"
          - "{repo_root}/build/nesting-validation-v3"
          - "--experiment"
          - "v3"
          - "--yes"
      # V4 is measured as a difference from the V1 converged child, so the V1
      # production entry above has to have run first -- --baseline-dir points at
      # it.  On CX3 submit tests/validation/nesting/submit_cx3_v4.pbs instead: it
      # defaults to the 'converged' V1 run in $EPHEMERAL.
      - label: "nesting-validation: V4 different parent geometry (production)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: slow
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/run_geometry.py"
          - "{repo_root}/build/nesting-validation-v4"
          - "--experiment"
          - "v4"
          - "--baseline-dir"
          - "{repo_root}/build/nesting-validation-v1/904"
          - "--yes"

  supported-macos:
    includes:
      - python-library
