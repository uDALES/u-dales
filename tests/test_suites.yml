        kind: integration
        component: gpu
        platform: gpu
        cost: medium
        env_UDALES_CPU_BUILD: "{repo_root}/build/cpu/debug/u-dales"
        env_UDALES_GPU_BUILD: "{repo_root}/build/gpu/debug/u-dales"
