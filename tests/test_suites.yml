description: Run curated test selections by support level from tests/test_suites.yml.

# Schema:
# - groups.<name>.suites: concrete suite entries for that selection
# - groups.<name>.includes: other group names to include
# - suite.label: human-readable display name
# - suite.class: execution policy (`supported` or `experimental`)
# - suite.kind: validation scope (`unit`, `integration`, `reference`, `system`, `regression`)
# - suite.component: subsystem or ownership area (`udbase`, `udgeom`, `udprep`, `ibm`, etc.)
# - suite.platform: where the suite can run (`any`, `linux`, `macos`, `hpc`).
#   `hpc` means TOO LARGE FOR A CI RUNNER: run_tests.py skips it (visibly, as
#   SKIP in the summary) unless invoked with --platform hpc on the target
#   machine. It is NOT a marker for "needs MPI" -- CI runners have MPI, and a
#   suite that finishes in seconds there belongs under `any`, or it silently
#   drops out of the merge gate the moment the label is honoured.
# - suite.cost: rough runtime tier (`fast`, `medium`, `slow`)
# - suite.command: argv list executed by tests/run_tests.py
# - suite.env_<NAME>: optional per-suite environment override exposed as <NAME>
#
# Conventions:
# - `class` is about support/merge-gate policy, not technical scope
# - `kind` is about technical scope, not CI policy
# - `supported-macos` is a temporary compatibility group, not the long-term
#   preferred schema shape
# - `python-library` is the single source of truth for the tools/python test
#   inventory. It uses `unittest discover`, so new test_*.py files are picked up
#   automatically. `supported`/`supported-macos` include it rather than
#   re-enumerating modules, so no test file can be silently dropped from the gate.

groups:
  python-library:
    suites:
      - label: "python-library: tools/python unit tests"
        class: supported
        kind: unit
        component: python
        platform: any
        cost: fast
        command:
          - "{python}"
          - "-m"
          - "unittest"
          - "discover"
          - "-s"
          - "{repo_root}/tools/python/tests"
          - "-p"
          - "test_*.py"
      - label: "python-library: directshortwave integration"
        class: supported
        kind: integration
        component: directshortwave
        platform: any
        cost: medium
        command:
          - "{python}"
          - "{tests_dir}/integration/directshortwave/test_directshortwave.py"
      - label: "python-library: udprep integration"
        class: supported
        kind: integration
        component: udprep
        platform: any
        cost: medium
        command:
          - "{python}"
          - "-m"
          - "unittest"
          - "discover"
          - "-s"
          - "{tests_dir}/integration/udprep"
          - "-p"
          - "test_*.py"
      - label: "python-library: udbase matlab integration"
        class: supported
        kind: reference
        component: udbase
        platform: any
        cost: medium
        command:
          - "{python}"
          - "{tests_dir}/integration/udbase_against_matlab/test_udbase_against_matlab.py"
      - label: "python-library: python preprocessing reference integration"
        class: supported
        kind: reference
        component: udprep
        platform: any
        cost: medium
        command:
          - "{python}"
          - "{tests_dir}/integration/python_preproc_against_matlab/test_python_preproc_against_matlab.py"

  # Compiler warnings are a class of defect CI catches and local testing did
  # not: CI builds with gfortran, most development here is Intel, and the two
  # disagree about both errors and warnings. This group closes that gap before
  # a push. It parses a build log rather than building (a full Debug build is
  # minutes; parsing is instant) and fails loudly when there is no usable log.
  # Not included by `supported-macos`: the baseline is measured against the
  # pinned Linux/CX3 module stacks, and Homebrew's gfortran is a different
  # version with a different warning set.
  lint:
    suites:
      - label: "lint: compiler warnings against the recorded baseline"
        class: supported
        kind: unit
        component: build
        platform: any
        cost: fast
        command:
          - "{python}"
          - "{tests_dir}/lint/check_build_warnings.py"

  supported:
    includes:
      - python-library
      - lint
      - nesting-unit
    suites:
      - label: "supported: regression"
        class: supported
        kind: regression
        component: regression
        platform: linux
        cost: slow
        command:
          - "{python}"
          - "{tests_dir}/regression/david_tests/run_tests.py"
          - "{branch_a}"
          - "{branch_b}"
          - "{build_type}"
      - label: "supported: ibm sparse input integration"
        class: supported
        kind: integration
        component: ibm
        platform: any
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "bash"
          - "{tests_dir}/integration/ibm_sparse_input/run_test.sh"
      - label: "supported: mpi operators integration"
        class: supported
        kind: integration
        component: solver
        platform: any
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "bash"
          - "{tests_dir}/integration/mpi_operators/run_test.sh"
      - label: "supported: processor boundaries integration"
        class: supported
        kind: integration
        component: solver
        platform: any
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/integration/processor_boundaries/test_processor_boundaries.py"

  # The in-solver unit runmodes are class: supported and cost: fast, and they
  # need only what CI already builds, so they belong in the merge gate. They
  # sat in `nesting` -- reachable only from `all` -- which meant CI compiled
  # modnesting and then ran none of it.
  nesting-unit:
    suites:
      - label: "nesting: weights unit runmode 1006 (U1-U7)"
        class: supported
        kind: unit
        component: nesting
        platform: any
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_REQUIRE_LAUNCHER: "1"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1006_weights"
      - label: "nesting: geometry unit runmode 1007 (U8-U14)"
        class: supported
        kind: unit
        component: nesting
        platform: any
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_REQUIRE_LAUNCHER: "1"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1007_geometry"
      - label: "nesting: io unit runmode 1008 (U15-U22)"
        class: supported
        kind: unit
        component: nesting
        platform: any
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_REQUIRE_LAUNCHER: "1"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1008_io"
      - label: "nesting: flux unit runmode 1009 (U23-U28, U35-U39)"
        class: supported
        kind: unit
        component: nesting
        platform: any
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_REQUIRE_LAUNCHER: "1"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1009_flux"
      - label: "nesting: update unit runmode 1010 (U29-U34)"
        class: supported
        kind: unit
        component: nesting
        platform: any
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_REQUIRE_LAUNCHER: "1"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1010_update"
      - label: "nesting: cold-start init unit runmode 1011 (U40-U43)"
        class: supported
        kind: unit
        component: nesting
        platform: any
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_REQUIRE_LAUNCHER: "1"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1011_init"
      - label: "nesting: abort cases (U13, U22, U27, schema 2)"
        class: supported
        kind: unit
        component: nesting
        platform: any
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_REQUIRE_LAUNCHER: "1"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_abort_cases"
      - label: "nesting: reported diagnostics (U14, schema 2 paths)"
        class: supported
        kind: unit
        component: nesting
        platform: any
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_REQUIRE_LAUNCHER: "1"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_reported_messages"

  nesting:
    includes:
      - nesting-unit
    suites:
      - label: "nesting: I1 no-op guarantee"
        class: experimental
        kind: integration
        component: nesting
        platform: hpc
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_BASELINE: "{repo_root}/build/u-dales.baseline"
        command:
