        platform: hpc
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_BASELINE: "{repo_root}/build/u-dales.baseline"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting_cases.py"
          - "TestI5DecompositionParity"
      - label: "nesting: I6 restart parity"
        class: experimental
        kind: integration
        component: nesting
        platform: hpc
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_BASELINE: "{repo_root}/build/u-dales.baseline"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting_cases.py"
          - "TestI6RestartParity"
      - label: "nesting: I7 zone isolation"
        class: experimental
        kind: integration
        component: nesting
