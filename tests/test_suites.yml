  # V1 "Big Brother" nesting validation (docs/udales-nesting-design.md 10.4).
  # An on-demand campaign, NOT a gate: this group is deliberately not included
  # by `all`, `supported` or `nesting`, and must be asked for by name.
  nesting-validation:
    suites:
      - label: "nesting-validation: V1 tiny end-to-end (harness smoke test)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/test_v1_tiny.py"
      - label: "nesting-validation: V1 Big Brother production campaign"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: slow
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_V1_RUNDIR: "{repo_root}/build/nesting-validation-v1"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/run_v1.py"
          - "{repo_root}/build/nesting-validation-v1"
          - "--preset"
          - "production"
          - "--yes"
      - label: "nesting-validation: V2 tiny sweep (harness smoke test)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/test_v2_tiny.py"
      # Reuses the V1 parent and the V1 child rather than running them, so the
      # V1 production entry above has to have run first -- --parent-dir and
      # --reuse-dir below point into its run directory.  On CX3 submit
      # tests/validation/nesting/submit_cx3_v2.pbs instead: it defaults to the
      # 'converged' V1 run in $EPHEMERAL and is sized against its measured
      # stage times.
      - label: "nesting-validation: V2 falsification sweep (production)"
        class: experimental
        kind: system
        component: nesting
        platform: hpc
        cost: slow
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/validation/nesting/run_v2.py"
          - "{repo_root}/build/nesting-validation-v2"
          - "--sweep"
          - "v2"
          - "--parent-dir"
          - "{repo_root}/build/nesting-validation-v1/903"
          - "--reuse-dir"
          - "{repo_root}/build/nesting-validation-v1/904"
          - "--yes"

  supported-macos:
    includes:
      - python-library
    suites:
      - label: "supported: ibm sparse input integration"
        class: supported
        kind: integration
        component: ibm
        platform: hpc
        cost: medium
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "bash"
          - "{tests_dir}/integration/ibm_sparse_input/run_test.sh"

  experimental:
    suites:
      - label: "experimental: python directshortwave unit"
        class: experimental
        kind: unit
        component: directshortwave
        platform: linux
        cost: fast
        env_UDALES_RUN_SLOW_TESTS: "1"
        command:
          - "{python}"
          - "-m"
          - "unittest"
          - "discover"
          - "-s"
          - "{repo_root}/tools/python/tests"
          - "-p"
          - "test_directshortwave.py"
      - label: "experimental: python directshortwave periodic unit"
        class: experimental
        kind: unit
        component: directshortwave
        platform: linux
        cost: medium
        env_UDALES_RUN_SLOW_TESTS: "1"
        command:
          - "{python}"
          - "-m"
          - "unittest"
          - "discover"
          - "-s"
          - "{repo_root}/tools/python/tests"
          - "-p"
          - "test_directshortwave_periodic.py"
      - label: "experimental: directshortwave integration"
        class: experimental
        kind: integration
        component: directshortwave
        platform: linux
        cost: medium
        command:
          - "{python}"
          - "{tests_dir}/integration/directshortwave/test_directshortwave.py"
      - label: "experimental: new vegetation module against v2.2"
        class: experimental
        kind: regression
        component: vegetation
        platform: hpc
        cost: slow
        command:
          - "{python}"
          - "{tests_dir}/regression/new_vegetation_module_against_v2.2/run_test.py"
          - "v2.2.0"
          - "{branch_b}"
          - "{build_type}"
      - label: "experimental: mpi averaging regression"
        class: experimental
        kind: regression
        component: solver
        platform: hpc
        cost: slow
        command:
          - "{python}"
          - "{tests_dir}/regression/mpi_averaging_regression/run_test.py"
          - "{branch_a}"
          - "{branch_b}"
          - "{build_type}"

  all:
    includes:
      - supported
      - experimental
      - nesting
