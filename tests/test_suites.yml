        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        env_UDALES_BASELINE: "{repo_root}/build/u-dales.baseline"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting_cases.py"
