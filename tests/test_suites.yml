        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1007_geometry"
      - label: "nesting: io unit runmode 1008 (U15-U22)"
        class: supported
        kind: unit
        component: nesting
        platform: hpc
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1008_io"
      - label: "nesting: flux unit runmode 1009 (U23-U28, U35-U39)"
        class: supported
        kind: unit
        component: nesting
        platform: hpc
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1009_flux"
      - label: "nesting: update unit runmode 1010 (U29-U34)"
        class: supported
        kind: unit
        component: nesting
        platform: hpc
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1010_update"
      - label: "nesting: cold-start init unit runmode 1011 (U40-U43)"
        class: supported
        kind: unit
        component: nesting
        platform: hpc
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_runmode_1011_init"
      - label: "nesting: abort cases (U13, U22, U27, schema 2)"
        class: supported
        kind: unit
        component: nesting
        platform: hpc
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_abort_cases"
      - label: "nesting: reported diagnostics (U14, schema 2 paths)"
        class: supported
        kind: unit
        component: nesting
        platform: hpc
        cost: fast
        env_UDALES_BUILD: "{repo_root}/build/{build_type_lower}/u-dales"
        command:
          - "{python}"
          - "{tests_dir}/integration/nesting/test_nesting.py"
          - "NestingUnitRunmodes.test_reported_messages"
      - label: "nesting: I1 no-op guarantee"
        class: experimental
        kind: integration
