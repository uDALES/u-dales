          - "{branch_b}"
          - "{build_type}"

  supported-macos:
    includes:
      - python-library
      - solver-suites

  experimental:
    suites:
      - label: "experimental: python directshortwave unit"
        class: experimental
        kind: unit
        component: directshortwave
        platform: linux
        cost: fast
        env_UDALES_RUN_SLOW_TESTS: "1"
        command:
          - "{python}"
          - "-m"
          - "unittest"
          - "discover"
          - "-s"
